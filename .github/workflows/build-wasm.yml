name: Build and Deploy Rust WASM

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Test Rust code
        run: cargo test

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Compile Rust to WebAssembly
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Verify WASM output
        run: |
          test -s pkg/docx_markdown_wasm_bg.wasm
          test -s pkg/docx_markdown_wasm.js
          ls -lh pkg/

      - name: Prepare browser package
        run: |
          rm -rf dist
          mkdir -p dist/pkg
          cp -R web/. dist/
          mkdir -p dist/pkg
          cp -R pkg/. dist/pkg/
          cp README.md dist/README.md
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/pkg/docx_markdown_wasm_bg.wasm
          test -s dist/pkg/docx_markdown_wasm.js

      - name: Upload compiled browser app
        uses: actions/upload-artifact@v4
        with:
          name: docx-markdown-wasm-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-static-branch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download compiled site
        uses: actions/download-artifact@v4
        with:
          name: docx-markdown-wasm-build
          path: /tmp/cloudflare-site

      - name: Publish Cloudflare-ready branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cloudflare-pages
          git rm -rf .
          mkdir -p site
          cp -R /tmp/cloudflare-site/. site/
          touch site/.nojekyll
          printf '%s\n' '# Cloudflare Pages build output' '' 'This branch is generated automatically from main.' 'Cloudflare Pages settings:' '- Production branch: cloudflare-pages' '- Build command: exit 0' '- Build output directory: site' > README.md
          git add README.md site
          git commit -m "Publish Cloudflare Pages site (${GITHUB_SHA::7})"
          git push --force origin HEAD:cloudflare-pages
