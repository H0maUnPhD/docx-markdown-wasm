name: Build and Deploy Rust WASM

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Test Rust code
        run: cargo test

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Compile Rust to WebAssembly
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Verify WASM output
        run: |
          test -s pkg/docx_markdown_wasm_bg.wasm
          test -s pkg/docx_markdown_wasm.js
          ls -lh pkg/

      - name: Prepare browser package
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web/. dist/
          cp -R pkg dist/pkg
          cp README.md dist/README.md
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/pkg/docx_markdown_wasm_bg.wasm

      - name: Upload compiled browser app
        uses: actions/upload-artifact@v4
        with:
          name: docx-markdown-wasm-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
