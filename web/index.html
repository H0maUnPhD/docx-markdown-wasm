<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DOCX → Markdown • Local</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1c2b59 0,transparent 35%),#0b1020}.wrap{max-width:1100px;margin:auto;padding:38px 20px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:clamp(30px,5vw,52px)}.tag{color:#9db0df}.pill{padding:8px 12px;border:1px solid #33456f;border-radius:999px;color:#bcd0ff}.drop{border:1.5px dashed #4862a3;border-radius:22px;padding:28px;text-align:center;background:#111936cc;cursor:pointer}.drop.drag{border-color:#9bb7ff;background:#172249}.drop strong{font-size:18px}.small{font-size:13px;color:#9db0df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#111936;border:1px solid #25345d;border-radius:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #25345d}.bar b{font-size:14px}.actions{display:flex;gap:8px}button{background:#233763;color:#fff;border:1px solid #3d568e;padding:8px 11px;border-radius:10px;cursor:pointer}button:hover{background:#2d477f}textarea,pre{margin:0;width:100%;height:420px;padding:16px;background:#0c132a;color:#eaf0ff;border:0;outline:0;resize:vertical;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow:auto}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stat{background:#111936;border:1px solid #25345d;border-radius:12px;padding:8px 10px;font-size:13px}.ok{color:#88e0a4}.warn{color:#ffd27b}@media(max-width:800px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>DOCX → Markdown</h1><div class="tag">Private, local conversion in your browser. No upload, no backend.</div></div><div id="engine" class="pill">Engine: loading…</div></div>
<label class="drop" id="drop"><input id="file" type="file" accept=".docx" hidden><strong>Drop a .docx file here</strong><div class="small">or click to choose a file • processing stays on this device</div></label>
<div class="stats" id="stats"></div>
<div class="grid"><section class="card"><div class="bar"><b>Markdown</b><div class="actions"><button id="copy">Copy</button><button id="save">Save .md</button></div></div><textarea id="out" placeholder="Markdown output will appear here…"></textarea></section><section class="card"><div class="bar"><b>Preview</b><span class="small">safe text preview</span></div><pre id="preview">Choose a DOCX file to start.</pre></section></div>
</main><script type="module" src="./app.js"></script></body></html>
